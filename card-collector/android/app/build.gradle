plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.trip.collector'
    compileSdk 36

    defaultConfig {
        testInstrumentationRunner 'kr.trip.collector.MessageNotificationCheck'
        applicationId 'kr.trip.collector'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3'
    }

    sourceSets.main.java.srcDir '../shared/src/main/java'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
