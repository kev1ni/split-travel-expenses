plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.trip.demo.notifier'
    compileSdk 36

    defaultConfig {
        applicationId 'kr.trip.demo.notifier'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    // Validate the notification against the same parser that ships in NTrip.
    sourceSets.main.java.srcDir '../shared/src/main/java'
}
